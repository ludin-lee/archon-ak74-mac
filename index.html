<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob: data:">
<title>Archon AK74</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --line: #d9d9de; --muted: #6e6e73; --accent: #e8590c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --card: #2c2c2e; --line: #3a3a3c; --muted: #98989d; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #status { color: var(--muted); margin-bottom: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: grid; grid-template-columns: 90px 1fr 28px; align-items: center; gap: 8px; margin-bottom: 10px; }
  label.check { display: flex; }
  select, input[type=range] { width: 100%; }
  output { text-align: right; color: var(--muted); }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  canvas { width: 100%; max-width: 480px; aspect-ratio: 240 / 135; background: #000; border-radius: 6px; display: block; margin: 10px 0; }
  progress { width: 100%; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
</style>
</head>
<body>
<h1>Archon AK74</h1>
<div id="status">연결 확인 중…</div>

<section>
  <h2>조명</h2>
  <label>모드 <select id="mode"></select><span></span></label>
  <label>색상 <input type="color" id="color" value="#ff0000"><span></span></label>
  <label class="check"><input type="checkbox" id="colorful"> 무지개색 (색상 대신)</label>
  <label>밝기 <input type="range" id="brightness" min="0" max="5" value="5"><output></output></label>
  <label>속도 <input type="range" id="speed" min="0" max="5" value="3"><output></output></label>
  <label>방향 <select id="direction"><option value="0">방향 1</option><option value="1">방향 2</option><option value="2">방향 3</option><option value="3">방향 4</option></select><span></span></label>
  <button class="primary" id="applyLight">조명 적용</button>
</section>

<section>
  <h2>화면</h2>
  <div class="row">
    <button id="showClock">🕐 시계 보기 (시간 동기화)</button>
    <button id="showGif">🖼 GIF 보기</button>
  </div>
  <p class="hint">GIF 보기는 마지막으로 올린 GIF를 다시 업로드합니다. 키보드에 화면 전환 명령이 없어서예요.</p>
  <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
  <input type="file" id="file" accept="image/gif,image/png,image/jpeg,image/webp">
  <label class="check"><input type="checkbox" id="crop"> 화면 꽉 채우기 (넘치는 부분 잘림)</label>
  <canvas id="preview" width="240" height="135"></canvas>
  <div id="frameInfo" class="hint"></div>
  <button class="primary" id="upload" disabled>GIF 업로드</button>
  <progress id="progress" max="1" value="0" hidden></progress>
</section>

<script>
const W = 240, H = 135, HEAD = 256, MAX_FRAMES = 141;
const $ = (id) => document.getElementById(id);

const modes = ['끄기', '고정 색'];
for (let i = 2; i <= 17; i++) modes.push(`효과 ${i}`);
modes.forEach((name, i) => $('mode').add(new Option(`${i}. ${name}`, i)));
$('mode').value = 1;

document.querySelectorAll('input[type=range]').forEach((r) => {
  const out = r.nextElementSibling;
  const sync = () => (out.textContent = r.value);
  r.addEventListener('input', sync);
  sync();
});

function setStatus(text) { $('status').textContent = text; }

async function refreshStatus() {
  setStatus((await kb.isConnected()) ? '✅ 키보드 연결됨' : '⚠️ 키보드를 찾을 수 없습니다 (USB로 연결해 주세요)');
}
refreshStatus();
setInterval(refreshStatus, 3000);

// Disable buttons while one device operation runs.
async function run(label, fn) {
  const buttons = document.querySelectorAll('button');
  buttons.forEach((b) => (b.disabled = true));
  setStatus(`${label} 중…`);
  try {
    await fn();
    setStatus(`✅ ${label} 완료`);
  } catch (e) {
    setStatus(`❌ ${label} 실패: ${e.message}`);
  } finally {
    buttons.forEach((b) => (b.disabled = false));
    $('upload').disabled = !screenData;
    $('progress').hidden = true;
  }
}

$('applyLight').onclick = () => run('조명 적용', () => {
  const hex = $('color').value;
  return kb.setLight({
    mode: +$('mode').value,
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
    colorful: $('colorful').checked,
    brightness: +$('brightness').value,
    speed: +$('speed').value,
    direction: +$('direction').value,
  });
});

$('showClock').onclick = () => run('시간 동기화', () => kb.syncTime());

kb.onProgress((p) => { $('progress').hidden = false; $('progress').value = p; });
$('showGif').onclick = () => run('GIF 표시', () => kb.showGif());

// ---- image -> keyboard screen buffer ----
let screenData = null;

function drawFit(ctx, src, sw, sh, crop) {
  const scale = (crop ? Math.max : Math.min)(W / sw, H / sh);
  const w = sw * scale, h = sh * scale;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(src, (W - w) / 2, (H - h) / 2, w, h);
}

// Layout from DeviceDriver.exe: 256-byte header (frame count, then per-frame delay in 2ms units),
// then RGB565 little-endian frames, all padded with 0xFF to a multiple of 4096.
async function prepareScreen(blob, crop) {
  const decoder = new ImageDecoder({ data: await blob.arrayBuffer(), type: blob.type });
  await decoder.tracks.ready;
  const total = decoder.tracks.selectedTrack.frameCount;
  const count = Math.min(total, MAX_FRAMES);

  const canvas = new OffscreenCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const size = HEAD + W * H * 2 * count;
  const data = new Uint8Array(Math.ceil(size / 4096) * 4096).fill(0xff);
  data[0] = count;
  for (let i = 0; i < count; i++) {
    const { image } = await decoder.decode({ frameIndex: i });
    const ms = image.duration ? image.duration / 1000 : 100;
    data[1 + i] = Math.max(1, Math.min(255, Math.round(ms / 2)));
    drawFit(ctx, image, image.displayWidth, image.displayHeight, crop);
    image.close();
    const px = ctx.getImageData(0, 0, W, H).data;
    let o = HEAD + i * W * H * 2;
    for (let p = 0; p < px.length; p += 4) {
      const v = ((px[p] & 0xf8) << 8) | ((px[p + 1] & 0xfc) << 3) | (px[p + 2] >> 3);
      data[o++] = v & 0xff;
      data[o++] = v >> 8;
    }
    if (i === 0) $('preview').getContext('2d').drawImage(canvas, 0, 0);
  }
  decoder.close();
  return { data, total, count };
}

async function loadFile() {
  const file = $('file').files[0];
  if (!file) return;
  try {
    const { data, total, count } = await prepareScreen(file, $('crop').checked);
    screenData = data;
    $('frameInfo').textContent = total > count
      ? `${total}프레임 중 앞의 ${count}프레임만 올라갑니다 (키보드 최대 ${MAX_FRAMES}프레임).`
      : `${count}프레임`;
    $('upload').disabled = false;
  } catch (e) {
    screenData = null;
    $('upload').disabled = true;
    setStatus(`❌ 이미지를 읽을 수 없습니다: ${e.message}`);
  }
}
$('file').onchange = loadFile;
$('crop').onchange = loadFile;

$('upload').onclick = () => run('GIF 업로드', () => kb.uploadScreen(screenData));
</script>
</body>
</html>
